<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRD dependency map</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f4f6f9, #101219);
    --surface: light-dark(#ffffff, #191c24);
    --surface-2: light-dark(#eef1f6, #20242d);
    --ink: light-dark(#1b1e27, #e8ebf1);
    --ink-soft: light-dark(#464d5e, #b2b9c8);
    --muted: light-dark(#737b8c, #7e8698);
    --border: light-dark(#dde2ea, #2a2f3a);
    --border-strong: light-dark(#c6cdd9, #3a414f);
    --accent: light-dark(#2f5fc4, #5b86e8);
    --crit: light-dark(#cf8a00, #e6b23e);
    --warn: light-dark(#c0562f, #e08258);
    --done: light-dark(#2e8b57, #4fc38a);
    --edge: light-dark(#b6bdca, #363d4a);
    --edge-crit: light-dark(#d99400, #e6b23e);
    --shadow: 0 1px 2px rgba(20,28,48,.08), 0 4px 14px rgba(20,28,48,.06);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 44px 28px 72px; }

  /* ── Masthead ── */
  header { border-bottom: 1px solid var(--border); padding-bottom: 26px; margin-bottom: 30px; }
  .eyebrow {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin: 0 0 12px;
  }
  h1 {
    font-size: clamp(26px, 4vw, 40px);
    line-height: 1.08; letter-spacing: -.02em; font-weight: 700;
    margin: 0 0 12px; text-wrap: balance; max-width: 22ch;
  }
  .deck { color: var(--ink-soft); font-size: 15.5px; max-width: 74ch; margin: 0; }

  /* ── Summary strip ── */
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .stat {
    display: flex; align-items: baseline; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 13px; box-shadow: var(--shadow);
  }
  .stat b { font-size: 18px; letter-spacing: -.01em; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .stat .dot { width: 9px; height: 9px; border-radius: 3px; align-self: center; }

  /* ── Legend ── */
  .legend {
    display: flex; flex-wrap: wrap; gap: 14px 26px;
    margin: 26px 0 8px; padding: 14px 18px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    font-size: 13px;
  }
  .legend-group { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .legend-label {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
  .lg { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-soft); }
  .lg .swatch { width: 13px; height: 13px; border-radius: 4px; flex: none; }
  .lg .line { width: 26px; height: 0; border-top: 3px solid var(--edge-crit); border-radius: 3px; }
  .lg .ring { width: 13px; height: 13px; border-radius: 4px; box-shadow: 0 0 0 2px var(--crit); background: var(--surface); }
  .lg .dash { width: 20px; height: 13px; border: 1.5px dashed var(--warn); border-radius: 4px; }

  /* ── Status chips ── */
  .st {
    font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    border-radius: 5px; padding: 1.5px 6px; border: 1px solid transparent;
  }
  .st-skeleton  { color: var(--muted); background: var(--surface-2); border-color: var(--border); }
  .st-specified { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .st-building  { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
  .st-done      { color: var(--done); background: color-mix(in srgb, var(--done) 13%, transparent); border-color: color-mix(in srgb, var(--done) 40%, transparent); }

  /* ── Graph ── */
  .graph-scroll { overflow-x: auto; margin: 8px -28px 0; padding: 8px 28px 4px; }
  .graph { position: relative; min-width: 900px; }
  .edges { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: visible; }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
  .edge.crit { stroke: var(--edge-crit); stroke-width: 2.6; }
  #ah path { fill: var(--edge); }
  #ah-crit path { fill: var(--edge-crit); }

  .layers { position: relative; display: flex; flex-direction: column; gap: 58px; }
  .layer { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 8px; }
  .layer-head { border-left: 2px solid var(--border-strong); padding-left: 14px; }
  .layer-n {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    color: var(--accent); font-weight: 600; letter-spacing: .08em;
  }
  .layer-name { font-size: 15px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; }
  .layer-hint { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .layer-nodes { display: flex; justify-content: center; align-items: stretch; gap: 18px; flex-wrap: wrap; }

  .node {
    position: relative; z-index: 1;
    flex: 0 0 158px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
    padding: 12px 13px 11px 16px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 3px;
    transition: opacity .16s ease, transform .16s ease, box-shadow .16s ease;
    cursor: default; outline: none;
  }
  .node:focus-visible { box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent); }
  .node-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 11px 0 0 11px; }
  .node.crit { box-shadow: var(--shadow), 0 0 0 2px var(--crit); }

  .node-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .node .wp { font-family: ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .node .ttl { font-size: 13.5px; font-weight: 620; letter-spacing: -.01em; }
  .node .desc { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
  .node .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 3px; }
  .node .owner { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-soft); min-width: 0; }
  .node .owner .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .node .issue {
    font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
    flex: none;
  }

  .node.external { border-style: dashed; border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }
  .chip-ext {
    margin-top: 6px; font-size: 10.5px; color: var(--warn);
    display: inline-flex; align-items: center; gap: 4px; align-self: flex-start;
    border: 1px dashed color-mix(in srgb, var(--warn) 60%, transparent);
    border-radius: 6px; padding: 2px 6px;
  }

  /* ── Tracing (hover / focus) ── */
  .graph.tracing .node { opacity: .32; }
  .graph.tracing .node.hl { opacity: 1; transform: translateY(-1px); }
  .graph.tracing .edge { opacity: .08; }
  .graph.tracing .edge.hl { opacity: 1; stroke: var(--accent); stroke-width: 2.4; }

  /* ── Footnotes ── */
  .footnote {
    margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 18px 40px; align-items: flex-start;
    font-size: 13px; color: var(--ink-soft);
  }
  .footnote h3 {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .cpath { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cpath .step {
    font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 13px;
    background: color-mix(in srgb, var(--crit) 14%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--crit) 45%, var(--border));
    color: color-mix(in srgb, var(--crit) 72%, var(--ink));
    border-radius: 7px; padding: 4px 9px;
  }
  .cpath .arrow { color: var(--crit); font-weight: 700; }
  .fn-block { max-width: 46ch; }
  .fn-block p { margin: 0; }
  .fn-block b.wpb { font-family: ui-monospace, Menlo, monospace; }

  footer.meta {
    margin-top: 28px; font-size: 12px; color: var(--muted);
    font-family: ui-monospace, Menlo, monospace; letter-spacing: .02em;
  }

  @media (prefers-reduced-motion: reduce) {
    .node, .graph.tracing .node.hl { transition: none; transform: none; }
  }
  @media (max-width: 620px) {
    .wrap { padding: 32px 16px 56px; }
    .graph-scroll { margin: 8px -16px 0; padding: 8px 16px 4px; }
    .layer { grid-template-columns: 1fr; }
  }
</style>
</head>

  const STATUS = {
    skeleton:  { label: "skeleton"  },
    specified: { label: "specified" },
    building:  { label: "building"  },
    done:      { label: "done"      }
  };
  const SIZE_W = { S: 1, M: 2, L: 3 };
  const PALETTE = [
    "light-dark(#2f6fd0,#5b90ea)", "light-dark(#0f9d8f,#2bc0ad)",
    "light-dark(#6d5bd0,#9887e8)", "light-dark(#b0509d,#d489c8)",
    "light-dark(#c0562f,#e08258)", "light-dark(#5f8f2e,#8fbf55)",
    "light-dark(#b98a00,#e6b23e)", "light-dark(#3a7ca5,#6fb3d8)"
  ];
  const NEUTRAL = "light-dark(#9aa2b1,#5c6474)";

  const WPS = DATA.wps.map(w => ({ deps: [], desc: "", owner: "", external: "", issue: "", ...w }));
  const byId = Object.fromEntries(WPS.map(w => [w.id, w]));
  WPS.forEach(w => { w.deps = w.deps.filter(d => byId[d]); });

  /* ── Layers: topological depth (cycle-safe) ── */
  const layerOf = {};
  function depth(id, seen) {
    if (id in layerOf) return layerOf[id];
    if (seen.has(id)) { console.warn("prd-kit: dependency cycle at", id); return 0; }
    seen.add(id);
    const w = byId[id];
    const d = w.deps.length ? 1 + Math.max(...w.deps.map(x => depth(x, seen))) : 0;
    layerOf[id] = d;
    return d;
  }
  WPS.forEach(w => depth(w.id, new Set()));
  const nLayers = Math.max(...Object.values(layerOf)) + 1;

  /* ── Critical path: heaviest dependency chain (weighted by size) ── */
  const memo = {};
  function heaviest(id) {
    if (memo[id]) return memo[id];
    const w = byId[id];
    let best = { weight: 0, chain: [] };
    w.deps.forEach(d => { const h = heaviest(d); if (h.weight > best.weight) best = h; });
    return memo[id] = { weight: best.weight + (SIZE_W[w.size] || 2), chain: [...best.chain, id] };
  }
  let critChain = { weight: 0, chain: [] };
  WPS.forEach(w => { const h = heaviest(w.id); if (h.weight > critChain.weight) critChain = h; });
  const critNodes = new Set([...critChain.chain, ...WPS.filter(w => w.critical).map(w => w.id)]);
  const critEdges = new Set(critChain.chain.slice(1).map((id, i) => critChain.chain[i] + ">" + id));

  /* ── Owner colours ── */
  const owners = [...new Set(WPS.map(w => w.owner).filter(Boolean))];
  const ownerColor = o => o ? PALETTE[owners.indexOf(o) % PALETTE.length] : NEUTRAL;

  /* ── Masthead + stats ── */
  document.getElementById("eyebrow").textContent = DATA.project;
  const counts = { skeleton: 0, specified: 0, building: 0, done: 0 };
  WPS.forEach(w => { if (w.status in counts) counts[w.status]++; });
  const nExt = WPS.filter(w => w.external).length;
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${WPS.length}</b><span>Work Packages</span></div>` +
    `<div class="stat"><b>${nLayers}</b><span>build layers</span></div>` +
    `<div class="stat"><span class="dot" style="background:var(--done)"></span><b>${counts.done}</b><span>done</span></div>` +
    (nExt ? `<div class="stat"><span class="dot" style="background:var(--warn)"></span><b>${nExt}</b><span>external blockers</span></div>` : "");

  /* ── Legend ── */
  const legendEl = document.getElementById("legend");
  legendEl.innerHTML =
    (owners.length ? `<div class="legend-group"><span class="legend-label">Owner</span>` +
      owners.map(o => `<span class="lg"><span class="swatch" style="background:${ownerColor(o)}"></span>${o} · ${WPS.filter(w => w.owner === o).length}</span>`).join("") +
      `</div>` : "") +
    `<div class="legend-group"><span class="legend-label">Status</span>` +
      Object.entries(STATUS).map(([k, s]) => `<span class="lg"><span class="st st-${k}">${s.label}</span> ${counts[k]}</span>`).join("") +
    `</div>` +
    `<div class="legend-group"><span class="legend-label">Marks</span>` +
      `<span class="lg"><span class="ring"></span>critical path</span>` +
      `<span class="lg"><span class="line"></span>critical dependency</span>` +
      `<span class="lg"><span class="dash"></span>external blocker</span>` +
    `</div>`;

  /* ── Layers + nodes ── */
  const layersEl = document.getElementById("layers");
  const nodes = {};
  for (let i = 0; i < nLayers; i++) {
    const row = document.createElement("div");
    row.className = "layer";
    const head = document.createElement("div");
    head.className = "layer-head";
    head.innerHTML =
      `<div class="layer-n mono">${String(i + 1).padStart(2, "0")}</div>` +
      `<div class="layer-name">Layer ${i + 1}</div>` +
      `<div class="layer-hint">${i === 0 ? "no internal dependencies" : "builds on layer " + i}</div>`;
    const holder = document.createElement("div");
    holder.className = "layer-nodes";
    WPS.filter(w => layerOf[w.id] === i).forEach(w => {
      const el = document.createElement("div");
      el.className = `node${critNodes.has(w.id) ? " crit" : ""}${w.external ? " external" : ""}`;
      el.dataset.wp = w.id;
      el.tabIndex = 0;
      el.innerHTML =
        `<span class="node-bar" style="background:${ownerColor(w.owner)}"></span>` +
        `<div class="node-top"><span class="wp mono">${w.id}</span><span class="st st-${w.status in STATUS ? w.status : "skeleton"}">${(STATUS[w.status] || STATUS.skeleton).label}</span></div>` +
        `<div class="ttl">${w.title || ""}</div>` +
        (w.desc ? `<div class="desc">${w.desc}</div>` : "") +
        ((w.owner || w.issue) ? `<div class="foot">` +
          (w.owner ? `<span class="owner"><span class="dot" style="background:${ownerColor(w.owner)}"></span>${w.owner}</span>` : `<span></span>`) +
          (w.issue ? `<span class="issue mono">${w.issue}</span>` : "") +
        `</div>` : "") +
        (w.external ? `<div class="chip-ext">⚠ external · ${w.external}</div>` : "");
      holder.appendChild(el);
      nodes[w.id] = el;
    });
    row.appendChild(head);
    row.appendChild(holder);
    layersEl.appendChild(row);
  }

  /* ── Edges ── */
  const graph = document.getElementById("graph");
  const svg = document.getElementById("edges");
  const DEFS =
    `<defs>` +
    `<marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z"/></marker>` +
    `<marker id="ah-crit" markerWidth="11" markerHeight="11" refX="6.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6.5,3.2 L0,6.4 Z"/></marker>` +
    `</defs>`;

  function draw() {
    const gr = graph.getBoundingClientRect();
    const W = graph.clientWidth, H = graph.clientHeight;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    let normal = "", crit = "";
    WPS.forEach(w => {
      const tgt = nodes[w.id];
      const tr = tgt.getBoundingClientRect();
      const tx = tr.left + tr.width / 2 - gr.left;
      const ty = tr.top - gr.top;
      w.deps.forEach(d => {
        const src = nodes[d];
        if (!src) return;
        const sr = src.getBoundingClientRect();
        const sx = sr.left + sr.width / 2 - gr.left;
        const sy = sr.bottom - gr.top;
        const c = Math.max(30, (ty - sy) * 0.42);
        const path = `M ${sx.toFixed(1)} ${sy.toFixed(1)} C ${sx.toFixed(1)} ${(sy + c).toFixed(1)}, ${tx.toFixed(1)} ${(ty - c).toFixed(1)}, ${tx.toFixed(1)} ${ty.toFixed(1)}`;
        const isCrit = critEdges.has(d + ">" + w.id);
        const seg = `<path class="edge${isCrit ? " crit" : ""}" data-a="${d}" data-b="${w.id}" d="${path}" marker-end="url(#${isCrit ? "ah-crit" : "ah"})"/>`;
        if (isCrit) crit += seg; else normal += seg;
      });
    });
    svg.innerHTML = DEFS + normal + crit;
  }

  /* ── Tracing on hover / focus ── */
  function trace(wp, on) {
    graph.classList.toggle("tracing", on);
    if (!on) {
      svg.querySelectorAll(".edge.hl").forEach(p => p.classList.remove("hl"));
      Object.values(nodes).forEach(n => n.classList.remove("hl"));
      return;
    }
    svg.querySelectorAll(".edge").forEach(p => {
      p.classList.toggle("hl", p.dataset.a === wp || p.dataset.b === wp);
    });
    Object.entries(nodes).forEach(([id, el]) => {
      let hit = id === wp;
      if (!hit) {
        hit = WPS.some(w =>
          (w.id === wp && w.deps.includes(id)) ||
          (w.id === id && w.deps.includes(wp))
        );
      }
      el.classList.toggle("hl", hit);
    });
  }
  Object.entries(nodes).forEach(([id, el]) => {
    el.addEventListener("mouseenter", () => trace(id, true));
    el.addEventListener("mouseleave", () => trace(id, false));
    el.addEventListener("focus", () => trace(id, true));
    el.addEventListener("blur", () => trace(id, false));
  });

  /* ── Footnotes: critical path · external blockers · ready to start ── */
  const ready = WPS.filter(w =>
    w.status !== "done" && w.status !== "building" &&
    w.deps.every(d => byId[d].status === "done")
  );
  const ext = WPS.filter(w => w.external);
  document.getElementById("footnote").innerHTML =
    `<div><h3>Critical path</h3><div class="cpath">` +
      critChain.chain.map(id => `<span class="step">${id}</span>`).join(`<span class="arrow">→</span>`) +
    `</div></div>` +
    (ext.length ? `<div class="fn-block"><h3>External blockers</h3><p>` +
      ext.map(w => `<b class="wpb">${w.id}</b> ${w.external}`).join(" · ") +
      `. PRDs can be written now; unblock early.</p></div>` : "") +
    `<div class="fn-block"><h3>Ready to start</h3><p>` +
      (ready.length
        ? `All dependencies done: ` + ready.map(w => `<b class="wpb">${w.id}</b>${w.status === "skeleton" ? " (fill first)" : ""}`).join(" · ") + `.`
        : `Nothing unblocked right now — finish what is <span class="st st-building">building</span>.`) +
    `</p></div>`;

  document.getElementById("meta").textContent =
    `generated by prd-kit /prd:map · updated ${DATA.updated} · source of truth: ${DATA.source}`;

  draw();
  if (window.ResizeObserver) new ResizeObserver(draw).observe(graph);
  window.addEventListener("resize", draw);
</script>
